on:
  push:
    branches:
      - master
    # A version tag (v0.5.0) also publishes the tested wheels to PyPI (job pypi)
    tags:
      - 'v*'
  repository_dispatch:
    types: [trigger_workflow]
  # A pull request is built and tested too (the continuous prerelease and PyPI
  # are only updated from master and version tags)
  pull_request:
    branches:
      - master

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  PYSIDE_VERSION: "6"
  QT_VERSION_MAJOR: "6"
  LLVM_VERSION: "13.0.1"
  # LIMA_PYTHON_VERSION: read by each job from aymara/version.py, the only
  # source of the version (step "Version")
  # The two wheels, their Qt and Python, are in the matrices of the jobs:
  # - manylinux_2_28 + Qt 6.9.3, built with Python 3.9: Python 3.9-3.13 on
  #   glibc >= 2.28
  # - manylinux_2_34 + Qt 6.12.0, built with Python 3.10: Python 3.10-3.15 on
  #   glibc >= 2.34 (Qt >= 6.10's PySide6 wheels are manylinux_2_34 only)
  # pip chooses: on glibc >= 2.34 and Python >= 3.10, the second (cp310-abi3
  # ranks before cp39-abi3), otherwise the first. They are built on the images
  # of aymara/lima's build-qt6.yml (aymara/lima-<manylinux>-qt<x.y>-python<v>).

# One run per ref at a time. On master the newest run replaces a pending one: a
# push waiting for LIMA's build (job wait-for-lima) is cancelled by the run that
# LIMA's success triggers (repository_dispatch, on master too), which builds
# the same commit on the new LIMA images. Tags and pull requests are queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/master' }}


jobs:

  # The wheels are built on the LIMA images of aymara/lima's build-qt6.yml
  # (:latest). A push made while that workflow builds master would use the
  # previous LIMA: wait for it to finish. Not needed when the run was triggered
  # by LIMA's success (repository_dispatch, from its
  # trigger-lima-python-on-success.yml).
  wait-for-lima:
    name: "Wait for the LIMA images being built"
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: "Wait for aymara/lima's build-qt6.yml on master"
        if: github.event_name != 'repository_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="repos/aymara/lima/actions/workflows/build-qt6.yml/runs?branch=master&event=push&per_page=10"
          while true; do
            pending=$(gh api "$runs" --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            [ "$pending" = "0" ] && break
            echo "$pending LIMA run(s) on master not completed yet, waiting..."
            sleep 120
          done
          last=$(gh api "$runs" --jq '.workflow_runs[0] | "\(.conclusion) \(.head_sha) \(.html_url)"')
          echo "Last LIMA run on master: $last"
          case "$last" in
            success*) ;;
            *) echo "::warning::The last LIMA build on master did not succeed ($last): the wheels use the previous LIMA images" ;;
          esac

  lima-python:
    name: "Build the ${{ matrix.manylinux }} wheel (Qt 6.${{ matrix.qt_minor }}, Python ${{ matrix.python }})"
    runs-on: ubuntu-latest
    needs: wait-for-lima
    strategy:
      fail-fast: false
      matrix:
        include:
          - manylinux: manylinux_2_28
            manylinux_tag: "2022-10-25-fbea779"
            python: "3.9"
            python_short: "cp39-cp39"
            python_wheel: "cp39-abi3"
            python_full: "3.9.15"
            qt_minor: "9"
            qt_patch: "3"
            gcc_version: "11.2.1"
          - manylinux: manylinux_2_34
            manylinux_tag: "2026.11.14-1"
            python: "3.10"
            python_short: "cp310-cp310"
            python_wheel: "cp310-abi3"
            python_full: "3.10.22"
            qt_minor: "12"
            qt_patch: "0"
            gcc_version: "14.2.1"
    env:
      MANYLINUX: ${{ matrix.manylinux }}
      MANYLINUX_TAG: ${{ matrix.manylinux_tag }}
      PYTHON_VERSION: ${{ matrix.python }}
      PYTHON_SHORT_VERSION: ${{ matrix.python_short }}
      PYTHON_WHEEL_VERSION: ${{ matrix.python_wheel }}
      PYTHON_FULL_VERSION: ${{ matrix.python_full }}
      QT_VERSION_MINOR: ${{ matrix.qt_minor }}
      QT_VERSION_PATCH: ${{ matrix.qt_patch }}
      QT_VERSION: "6.${{ matrix.qt_minor }}"
      QT_FULL_VERSION: "6.${{ matrix.qt_minor }}.${{ matrix.qt_patch }}"
      GCC_VERSION: ${{ matrix.gcc_version }}
    steps:
      -
        name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.AYMARA_DOCKERHUB_USERNAME }}
          password: ${{ secrets.AYMARA_DOCKERHUB_TOKEN }}

      - name: "Checkout code"
        uses: actions/checkout@v2
      - name: "Version (aymara/version.py)"
        run: echo "LIMA_PYTHON_VERSION=$(python3 aymara/version.py)" >> "$GITHUB_ENV"

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.2.0
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: "Build image"
        run: docker build -f Dockerfile-manylinux_2_28 --build-arg MANYLINUX="${MANYLINUX}" --build-arg MANYLINUX_TAG="${MANYLINUX_TAG}" --build-arg PYSIDE_VERSION="${PYSIDE_VERSION}" --build-arg PYTHON_VERSION="${PYTHON_VERSION}" --build-arg PYTHON_SHORT_VERSION=${PYTHON_SHORT_VERSION} --build-arg PYTHON_FULL_VERSION=${PYTHON_FULL_VERSION} --build-arg LIMA_PYTHON_VERSION=${LIMA_PYTHON_VERSION} --build-arg PYTHON_WHEEL_VERSION="${PYTHON_WHEEL_VERSION}" --build-arg BRANCH="${{ github.ref_name }}" --build-arg QT_FULL_VERSION="${QT_FULL_VERSION}" --build-arg QT_VERSION_MAJOR="${QT_VERSION_MAJOR}" --build-arg QT_VERSION_MINOR="${QT_VERSION_MINOR}" --build-arg QT_VERSION_PATCH="${QT_VERSION_PATCH}" --build-arg QT_VERSION="${QT_VERSION}" -t aymara/lima-python${PYTHON_VERSION}:latest .

      - name: "Push image"
        run: docker push aymara/lima-python${PYTHON_VERSION}:latest

      - uses: shrink/actions-docker-extract@v2
        id: extract
        with:
          image: aymara/lima-python${{ env.PYTHON_VERSION }}:latest
          path: /lima-python/wheelhouse/aymara-${{ env.LIMA_PYTHON_VERSION }}-${{ env.PYTHON_WHEEL_VERSION }}-${{ env.MANYLINUX }}_x86_64.whl
          destination: dist

      - name: upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: aymara-${{ env.LIMA_PYTHON_VERSION }}-${{ env.PYTHON_WHEEL_VERSION }}-${{ env.MANYLINUX }}_x86_64.whl
          path: dist
          if-no-files-found: error
          overwrite: true
          compression-level: 0 # wheels are already zip files

  lima-python-tests:
    name: "Test the ${{ matrix.manylinux }} wheel on Python ${{ matrix.test_python }}"
    runs-on: ubuntu-latest
    needs: lima-python
    strategy:
      fail-fast: false
      matrix:
        # Each wheel on the oldest and the newest Python its shiboken6 supports:
        # the abi3 wheel built with the first must work with all of them
        include:
          - {manylinux: manylinux_2_28, python: "3.9", python_wheel: "cp39-abi3", test_python: "3.9"}
          - {manylinux: manylinux_2_28, python: "3.9", python_wheel: "cp39-abi3", test_python: "3.13"}
          - {manylinux: manylinux_2_34, python: "3.10", python_wheel: "cp310-abi3", test_python: "3.10"}
          - {manylinux: manylinux_2_34, python: "3.10", python_wheel: "cp310-abi3", test_python: "3.15"}
    env:
      MANYLINUX: ${{ matrix.manylinux }}
      PYTHON_VERSION: ${{ matrix.python }}
      PYTHON_WHEEL_VERSION: ${{ matrix.python_wheel }}

    steps:
      -
        name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.AYMARA_DOCKERHUB_USERNAME }}
          password: ${{ secrets.AYMARA_DOCKERHUB_TOKEN }}

      - name: "Checkout code"
        uses: actions/checkout@v2
      - name: "Version (aymara/version.py)"
        run: echo "LIMA_PYTHON_VERSION=$(python3 aymara/version.py)" >> "$GITHUB_ENV"

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.2.0
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: "Build image"
        run: docker build -f Dockerfile-tests-actions --build-arg MANYLINUX="${MANYLINUX}" --build-arg PYTHON_VERSION="${PYTHON_VERSION}" --build-arg TEST_PYTHON_VERSION="${{ matrix.test_python }}" --build-arg PYTHON_WHEEL_VERSION="${PYTHON_WHEEL_VERSION}" --build-arg LIMA_PYTHON_VERSION=${LIMA_PYTHON_VERSION} .

  # The Windows wheel (cp310-abi3, Qt 6.12.0) is built against the LIMA
  # Windows package of aymara/lima's build-win.yml (its "continuous"
  # prerelease, updated on master), with scripts/build-wheel-windows.ps1.
  windows-wheel:
    name: "Build the Windows wheel (Qt 6.12.0, Python 3.10)"
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      QT_VERSION: "6.12.0"
      QT_BUILD: "6.12.0-0-202609280346"
      PYTHON_WHEEL_VERSION: "cp310-abi3"
      DEPS: ${{ github.workspace }}\deps
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
      - name: "Version (aymara/version.py)"
        shell: bash
        run: echo "LIMA_PYTHON_VERSION=$(python aymara/version.py)" >> "$GITHUB_ENV"

      - name: "Wait for aymara/lima's build-win.yml on master"
        if: github.event_name != 'repository_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="repos/aymara/lima/actions/workflows/build-win.yml/runs?branch=master&event=push&per_page=10"
          while true; do
            pending=$(gh api "$runs" --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            [ "$pending" = "0" ] && break
            echo "$pending LIMA Windows run(s) on master not completed yet, waiting..."
            sleep 120
          done

      - name: "Download the LIMA Windows package"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download continuous -R aymara/lima -p 'lima-*-win64.zip' -D lima-zip
          7z x -y -olima-zip lima-zip/*.zip > /dev/null
          echo "LIMA_DIST=$(cygpath -w "$(ls -d "$PWD"/lima-zip/lima-*-win64 | head -1)")" >> "$GITHUB_ENV"

      - name: "Set up MSVC developer environment"
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: "Cache Qt"
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-qt${{ env.QT_VERSION }}

      - name: "Download Qt (MSVC 2022 x64: qtbase, qtdeclarative)"
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $qtv = $env:QT_VERSION -replace '\.', ''
          $base = "https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_$qtv/qt6_${qtv}_msvc2022_64/qt.qt6.$qtv.win64_msvc2022_64/$env:QT_BUILD"
          $qtdir = "$env:DEPS\Qt\$env:QT_VERSION\msvc2022_64"
          New-Item -ItemType Directory -Force $qtdir | Out-Null
          foreach ($m in 'qtbase', 'qtdeclarative') {
              Invoke-WebRequest -Uri "$base$m-Windows-Windows_11_24H2-MSVC2022-Windows-Windows_11_24H2-X86_64.7z" -OutFile "$m.7z"
              7z x -y "-o$qtdir" "$m.7z" | Select-Object -Last 1
              Remove-Item "$m.7z"
          }

      # LIMA's headers include Boost's and ICU's
      - name: "Install Boost and ICU headers via vcpkg"
        uses: johnwason/vcpkg-action@v6
        with:
          pkgs: >-
            boost-regex boost-filesystem boost-program-options
            boost-system boost-thread boost-test boost-iostreams
            boost-serialization boost-spirit boost-graph boost-tuple
            boost-algorithm boost-tokenizer boost-fusion boost-format
            boost-foreach boost-process boost-any boost-functional
            boost-lexical-cast boost-range boost-concept-check
            boost-bind boost-smart-ptr icu
          triplet: x64-windows-release
          token: ${{ github.token }}
          github-binarycache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "Build requirements"
        run: >-
          python -m pip install setuptools wheel scikit-build cmake ninja
          delvewheel pefile shiboken6==${{ env.QT_VERSION }}
          shiboken6_generator==${{ env.QT_VERSION }}
          PySide6_Essentials==${{ env.QT_VERSION }}

      - name: "Build and repair the wheel"
        shell: pwsh
        run: |
          $boostVersion = Get-ChildItem -Recurse -File "${{ github.workspace }}\vcpkg\installed" -Filter version.hpp | Where-Object { $_.DirectoryName -match '\\include\\boost$' } | Select-Object -First 1
          if (-not $boostVersion) { throw "Boost headers not found in vcpkg's installed tree" }
          $include = $boostVersion.Directory.Parent.FullName
          Write-Host "Boost and ICU headers in $include"
          # shiboken's parser (libclang) must not use the headers of another clang
          # (e.g. Visual Studio's Clang 19: "undeclared __builtin_ia32_..."):
          # build without any clang in the PATH, as on a plain Build Tools install
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Llvm\\|\\LLVM\\' }) -join ';'
          ./scripts/build-wheel-windows.ps1 -LimaDist $env:LIMA_DIST `
            -QtDir "$env:DEPS\Qt\$env:QT_VERSION\msvc2022_64" `
            -ExtraInclude $include -OutDir dist-windows

      - name: "Upload the wheel"
        uses: actions/upload-artifact@v4
        with:
          name: aymara-${{ env.LIMA_PYTHON_VERSION }}-${{ env.PYTHON_WHEEL_VERSION }}-win_amd64.whl
          path: dist-windows
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  windows-tests:
    name: "Test the Windows wheel on Python ${{ matrix.python }}"
    runs-on: windows-2022
    needs: windows-wheel
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest Python the abi3 wheel supports
        python: ["3.10", "3.13"]
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Download the wheel
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: aymara-*-win_amd64.whl
          merge-multiple: true
      - name: "Install the wheel and the test requirements"
        shell: bash
        run: python -m pip install dist/*.whl pytest pytest-cov pytest-depends
      - name: "Cache the models"
        uses: actions/cache@v4
        with:
          path: ~/.local/share/lima/resources
          key: lima-models-eng-EWT-fra
      - name: "Install the models used by the tests"
        run: |
          lima_models -i eng-UD_English-EWT
          lima_models -i fra
      - name: "Run the tests (on the installed wheel, not the sources)"
        shell: bash
        run: |
          mkdir ../wheel-tests && cp -r tests pytest.ini ../wheel-tests/
          cd ../wheel-tests && python -m pytest -p no:cacheprovider tests

  # The continuous prerelease follows master, with the three wheels; a version tag
  # gets its own release (job pypi). commit is the SHA: a tag name
  # (github.ref_name on a tag) is not a valid target_commitish (error 422)
  continuous:
    name: "Update the continuous prerelease"
    runs-on: ubuntu-latest
    needs: [lima-python-tests, windows-tests]
    if: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
    permissions:
      contents: write
    steps:
      - name: Download the wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: aymara-*.whl
          merge-multiple: true
      - run: ls -l dist
      - uses: ncipollo/release-action@v1
        with:
          artifacts: dist/*.whl
          allowUpdates: true
          artifactErrorsFailBuild: true
          prerelease: true
          tag: continuous
          commit: ${{ github.sha }}

  # On a version tag only, once the wheels are tested: publish them to PyPI with
  # trusted publishing (no token stored here: PyPI trusts this workflow, see
  # https://docs.pypi.org/trusted-publishers/; to set up once on PyPI, project
  # aymara, Publishing: owner aymara, repository lima-python, workflow
  # build-qt6.yml, environment pypi), and make them a GitHub release
  pypi:
    name: "Publish the wheels to PyPI"
    runs-on: ubuntu-latest
    needs: [lima-python-tests, windows-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/aymara/
    permissions:
      id-token: write   # trusted publishing
      contents: write   # the GitHub release
    steps:
      - name: "Checkout code"   # aymara/version.py, CHANGES.md
        uses: actions/checkout@v4
      - name: "Version (aymara/version.py)"
        run: echo "LIMA_PYTHON_VERSION=$(python3 aymara/version.py)" >> "$GITHUB_ENV"
      - name: "The tag is the version"
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${LIMA_PYTHON_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match aymara/version.py (${LIMA_PYTHON_VERSION})" >&2
            exit 1
          fi
      - name: "Release notes: this version's section of CHANGES.md"
        run: awk '/^## /{n++} n==1' CHANGES.md > release-notes.md && cat release-notes.md
      - name: Download the wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: aymara-${{ env.LIMA_PYTHON_VERSION }}-*.whl
          merge-multiple: true
      - name: "The three wheels are there"
        run: |
          ls -l dist
          [ "$(ls dist/*.whl | wc -l)" -eq 3 ] || { echo "Expected 3 wheels" >&2; exit 1; }
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - uses: ncipollo/release-action@v1
        with:
          artifacts: dist/*.whl
          bodyFile: release-notes.md
          prerelease: false
          tag: ${{ github.ref_name }}
